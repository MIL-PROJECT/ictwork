# 이 파일을 같은 폴더에 application.yml로 복사하고 값을 채운다. application.yml은 Git에서 제외된다.
# src/backend에서 실행하면(gradlew bootRun·test, java -jar) Spring Boot가 ./config/application.yml을 자동으로 읽는다.
spring:
  datasource:
    username: ictwork
    password: (로컬 MySQL 앱 접속 비밀번호)

# 공통 초기 비밀번호 (계정 만들기·관리자 초기화, DEC-056). 비밀번호 규칙에 맞는 값. 평문은 secrets/로컬계정.md에도 적는다
ictwork:
  initial-password: (공통 초기 비밀번호)
  # QA 마스터 (DEC-067, QA·시연용). 쓰지 않으면 두 줄을 비우거나 지운다(기능 꺼짐). 원문은 secrets/로컬계정.md
  # 해시는 비용 10인 bcrypt($2a$10$...)만 받는다(계정 해시와 같은 비용, 다르면 서버가 시작하지 않음). 따옴표로 감싼다
  # 아이디는 DB 계정 아이디와 겹치지 않게 한다(겹치면 그 계정은 로그인할 수 없음)
  # qa-master:
  #   login-id: "(마스터 아이디)"
  #   password-hash: "(마스터 비밀번호의 bcrypt 해시)"
  # 공유 문서함 용량 상한(MB, REQ-A06). 처음 값(문서함 50·전체 500)은 src/main/resources/application.yml. 바꿀 때만 적는다
  # docbox:
  #   box-limit-mb: 50
  #   total-limit-mb: 500
  # AI 질의응답 (REQ-B09, NFR-005). 처음 값은 application.yml(끔)·application-local.yml(켬). 바꿀 때만 적는다
  # ai:
  #   enabled: true
  #   base-url: http://127.0.0.1:11434  # 같은 PC(localhost·127.0.0.1·::1)만 받는다
  #   chat-model: qwen3:8b
  #   embed-model: bge-m3
